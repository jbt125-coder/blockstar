<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Blockstar</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
  #touch{position:fixed;inset:0;z-index:1}
  .ui{position:fixed;z-index:5}
  #tint{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s}
  #hurt{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,rgba(255,0,0,0) 40%,rgba(255,0,0,.55) 100%)}
  #burn{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,rgba(255,120,0,0) 45%,rgba(255,110,0,.5) 100%)}
  #web{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;background-size:cover;background-position:center}
  #webCount{display:none;margin-top:5px;margin-left:6px;background:rgba(20,24,32,.6);padding:3px 10px;border-radius:10px;font-weight:800;font-size:15px;color:#eee}
  .ibtn.gray{background:#c9ced8}
  .sbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .fld{margin-top:8px;font-weight:700}
  .fld input{display:block;width:100%;box-sizing:border-box;margin-top:4px;height:40px;border-radius:9px;border:2px solid rgba(255,255,255,.25);background:#11151d;color:#fff;font-size:16px;padding:0 10px}
  #cross{left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;z-index:4}
  #cross:before,#cross:after{content:"";position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 2px #000}
  #cross:before{left:10px;top:0;width:2px;height:22px}
  #cross:after{left:0;top:10px;width:22px;height:2px}
  #cross.mob:before,#cross.mob:after{background:#ff4d4d}

  #top{top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:7px}
  .tbtn{min-width:44px;height:42px;padding:0 9px;border-radius:12px;border:2px solid rgba(255,255,255,.35);
    background:rgba(20,24,32,.6);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;white-space:nowrap}
  .tbtn.on{background:rgba(46,160,140,.8);border-color:#7fe3cf}

  #hud{top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));pointer-events:none}
  #hearts{font-size:17px;letter-spacing:1px;text-shadow:0 1px 2px #000;line-height:1}
  #hearts .h{color:#ff3b4a}#hearts .e{color:rgba(0,0,0,.45)}
  #coins{display:inline-block;margin-top:5px;background:rgba(20,24,32,.6);padding:3px 10px;border-radius:10px;font-weight:800;font-size:15px;color:#ffd84a}
  #looking{top:calc(64px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));
    background:rgba(20,24,32,.55);padding:5px 10px;border-radius:10px;font-size:13px;pointer-events:none;display:none}

  #card{top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 24px));
    background:rgba(15,18,26,.88);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 14px;
    display:none;font-size:14px;line-height:1.35;cursor:pointer}
  #card .nm{font-size:18px;font-weight:800;margin-right:8px}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700;color:#111;vertical-align:middle}
  #card .fact{margin-top:6px;color:#e6e9ef}

  #hotwrap{bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    width:min(560px,calc(100vw - 420px));min-width:220px}
  #selname{text-align:center;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000;margin-bottom:4px;pointer-events:none}
  #hotbar{display:flex;gap:4px;overflow-x:auto;padding:5px;background:rgba(20,24,32,.6);border-radius:12px;
    border:2px solid rgba(255,255,255,.2);scrollbar-width:none;touch-action:pan-x}
  #hotbar::-webkit-scrollbar{display:none}
  .slot{flex:0 0 46px;height:46px;border-radius:8px;border:2px solid transparent;background:rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .slot.sel{border-color:#fff;background:rgba(255,255,255,.22)}
  .slot canvas{width:38px;height:38px;image-rendering:pixelated}
  .slot .dot{position:absolute;bottom:2px;right:2px;width:8px;height:8px;border-radius:50%;border:1px solid #000}

  #act{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:190px;height:190px}
  .abtn{position:absolute;width:70px;height:70px;border-radius:50%;border:3px solid rgba(255,255,255,.45);
    background:rgba(20,24,32,.55);color:#fff;font-size:12px;font-weight:800;display:flex;flex-direction:column;
    align-items:center;justify-content:center;line-height:1.1}
  .abtn span{font-size:26px}
  .abtn.down{background:rgba(255,255,255,.35)}
  #bPlace{right:0;top:20px}
  #bBreak{right:88px;top:0}
  #bJump{right:20px;bottom:0}
  #bDown{right:110px;bottom:0;display:none}
  #bHorn{right:20px;bottom:0;display:none} #bSiren{right:88px;top:0;display:none} body.drive #bHorn{display:flex} body.drive.dsiren #bSiren{display:flex}
  body.drive #bBreak,body.drive #bPlace,body.drive #bJump,body.drive #bDown,body.drive #bSwap,body.drive #cross,body.drive #hotwrap{display:none!important}
  .fly #bDown{display:flex}
  #bTalk{right:calc(20px + env(safe-area-inset-right));bottom:calc(214px + env(safe-area-inset-bottom));height:46px;padding:0 16px;border-radius:23px;
    background:#ffcf4a;color:#222;font-weight:900;font-size:16px;display:none;align-items:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  #prompt{left:50%;top:calc(50% + 34px);transform:translateX(-50%);background:rgba(15,18,26,.75);padding:5px 12px;border-radius:9px;
    font-size:13px;font-weight:700;pointer-events:none;display:none}

  #joyBase{width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(20,24,32,.3);
    position:fixed;z-index:3;display:none;pointer-events:none}
  #joyKnob{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.55);position:fixed;z-index:3;display:none;pointer-events:none}
  #joyHint{left:calc(40px + env(safe-area-inset-left));bottom:calc(40px + env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;
    border:3px dashed rgba(255,255,255,.25);pointer-events:none;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:rgba(255,255,255,.6);text-align:center}

  #dash{display:none} body.drive #dash{display:block} body.drive #joyHint,body.drive #joyBase,body.drive #joyKnob{display:none!important}
  #dWheel{left:calc(16px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));width:150px;height:150px;touch-action:none;cursor:grab}
  #dWheelIn{width:100%;height:100%;pointer-events:none}
  .ped{touch-action:none;border-radius:12px;border:3px solid rgba(255,255,255,.5);background:linear-gradient(#3a3e48,#20232a);color:#fff;font-weight:900;font-size:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;box-sizing:border-box;cursor:pointer;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 4px,transparent 4px 12px),linear-gradient(#3a3e48,#20232a);transition:transform .05s}
  .ped.on,.ped.down{transform:translateY(4px) scale(.95);border-color:#fff;filter:brightness(1.5)}
  #dGas{right:calc(16px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:66px;height:120px}
  #dBrake{right:calc(94px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:86px;height:80px}
  #dGas.on,#dGas.down{border-color:#4ade80} #dBrake.on,#dBrake.down{border-color:#ff5a4a}
  #dSpeedo{left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom));width:150px;height:84px;pointer-events:none}
  #dFuel{left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));width:90px;height:8px;border-radius:4px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.5);pointer-events:none;display:none}
  #dFuelIn{height:100%;background:linear-gradient(90deg,#ff5a3a,#ffc83a,#4ade80);border-radius:3px}
  .dbig{border-radius:50%;width:74px;height:74px;display:none;align-items:center;justify-content:center;flex-direction:column;font-weight:900;font-size:12px;color:#fff;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.5);cursor:pointer;line-height:1.1}
  .dbig span{font-size:28px}
  #dChute{right:calc(190px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));background:#e8342a;animation:dpulse .8s infinite alternate} body.drive.dchute #dChute{display:flex}
  #dHop{right:calc(190px + env(safe-area-inset-right));bottom:calc(98px + env(safe-area-inset-bottom));background:#8a1ad8} body.drive.dhop #dHop{display:flex}
  @keyframes dpulse{to{transform:scale(1.08)}}
  #dAct{left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));height:44px;padding:0 16px;border-radius:22px;background:#ffcf4a;color:#222;font-weight:900;font-size:15px;display:none;align-items:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer;white-space:nowrap}
  #dUp,#dDn{left:calc(180px + env(safe-area-inset-left));width:62px;height:56px;display:none;justify-content:center;font-size:24px;padding:0} body.drive.djet #dUp,body.drive.djet #dDn{display:flex}
  #dUp{bottom:calc(84px + env(safe-area-inset-bottom))} #dDn{bottom:calc(14px + env(safe-area-inset-bottom))}
  body.drive #act{bottom:calc(140px + env(safe-area-inset-bottom));height:80px;width:160px} body.drive #bTalk{bottom:calc(228px + env(safe-area-inset-bottom))}
  #dragHud{left:50%;top:calc(56px + env(safe-area-inset-top));transform:translateX(-50%);display:none;align-items:center;gap:6px;background:rgba(10,12,20,.8);padding:6px 12px;border-radius:14px;font-weight:900;font-size:15px;white-space:nowrap;pointer-events:none}
  #dragHud i{display:inline-block;width:15px;height:15px;border-radius:50%;background:rgba(60,60,60,.7);border:1px solid rgba(255,255,255,.3)} #dragHud b{margin-left:6px;min-width:60px}
  #dragSlip{left:50%;top:50%;transform:translate(-50%,-50%);background:#fffbe8;color:#222;font-family:ui-monospace,Menlo,monospace;padding:12px 16px;border-radius:8px;max-width:92vw;max-height:78vh;overflow:auto;display:none;box-shadow:0 6px 24px rgba(0,0,0,.6);border-top:8px solid #ffc83a;cursor:pointer;font-size:13px}
  #dragSlip .dsT{font:900 20px sans-serif;text-align:center;margin-bottom:6px} #dragSlip table{border-collapse:collapse;width:100%} #dragSlip td{padding:2px 8px;border-bottom:1px dashed #ccc;white-space:nowrap} #dragSlip td+td{text-align:right}
  #dragSlip .dsB{text-align:center;font-weight:900;margin-top:6px;color:#b07800} #dragSlip .dsH{text-align:center;font:12px sans-serif;color:#777;margin-top:6px}
  #toast{left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(15,18,26,.85);padding:8px 14px;border-radius:10px;
    font-size:14px;font-weight:700;display:none;pointer-events:none;text-align:center;max-width:80vw}

  #title{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(6vh + env(safe-area-inset-top)) 16px calc(7vh + env(safe-area-inset-bottom));z-index:10;pointer-events:none;box-sizing:border-box;display:none}
  body.title #title{display:flex} body.title .ui:not(#title):not(#modal):not(#toast){display:none!important}
  #title .tbox{text-align:center}
  #title #tGear{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));pointer-events:auto;font-size:22px;padding:0;width:48px;height:48px;border-radius:12px;border:2px solid rgba(255,255,255,.4);background:rgba(20,24,32,.6);box-shadow:none;animation:none}
  #title .tname{font:900 clamp(46px,11vw,96px)/1 'Trebuchet MS',Verdana,sans-serif;letter-spacing:2px;color:#f4f0e6;-webkit-text-stroke:2px #3a2a1a;
    text-shadow:0 4px 0 #6aa83a,0 8px 0 #86603f,0 12px 0 #5a4030,0 18px 24px rgba(0,0,0,.6)}
  #title .tsub{margin-top:18px;font:800 clamp(17px,4vw,26px) sans-serif;color:#fff;text-shadow:0 2px 6px #000;letter-spacing:3px}
  #title .tbtns{display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:auto}
  #title button{font:900 clamp(20px,5vw,28px) sans-serif;padding:14px 34px;border-radius:14px;border:3px solid #fff;background:#3fa34d;color:#fff;box-shadow:0 6px 0 #22662c,0 10px 20px rgba(0,0,0,.4);cursor:pointer;animation:tpulse 1.6s ease-in-out infinite}
  #title #tCont{font-size:clamp(15px,3.6vw,18px);padding:9px 20px;background:rgba(20,24,32,.75);box-shadow:none;animation:none;border-width:2px}
  @keyframes tpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #modal{inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
  #modal .box{width:min(560px,calc(100vw - 30px));max-height:calc(100vh - 30px);overflow:auto;background:#1a1f2b;border-radius:16px;
    padding:16px 18px;border:2px solid rgba(255,255,255,.2);font-size:14px;line-height:1.45;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  #modal h2{margin:0 0 6px;font-size:21px}
  #modal h3{margin:12px 0 4px;font-size:15px;color:#7fe3cf}
  #modal ul{margin:0;padding-left:18px}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .mbtn{flex:1;min-width:110px;height:44px;border-radius:10px;border:none;font-size:15px;font-weight:800;cursor:pointer;color:#111;background:#7fe3cf}
  .mbtn.red{background:#ff8a7a}.mbtn.gray{background:#c9ced8}.mbtn.gold{background:#ffcf4a}
  .say{background:#2a3142;border-radius:12px;padding:10px 12px;margin:8px 0;font-style:italic}
  .item{display:flex;align-items:center;gap:10px;background:#232a39;border-radius:12px;padding:8px 10px;margin-top:8px}
  .item .ic{font-size:28px;width:36px;text-align:center}
  .item .tx{flex:1;font-size:13px}
  .item .tx b{font-size:15px}
  .item .st{font-size:12px;color:#ffd84a;font-weight:700}
  .item .fx{color:#b8c0cf;font-size:12px;margin-top:2px}
  .ibtn{min-width:78px;height:40px;border-radius:10px;border:none;font-weight:900;font-size:14px;background:#ffcf4a;color:#222}
  .ibtn.dis{background:#4a5161;color:#9aa1ad}
  .ibtn.eq{background:#7fe3cf}

  /* title: smaller buttons under Start */
  #title .tsmall{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #title .tsmall button{font-size:clamp(14px,3.4vw,17px);padding:9px 16px;background:rgba(20,24,32,.75);box-shadow:none;animation:none;border-width:2px}
  /* character creator */
  #cc{position:fixed;inset:0;z-index:12;display:none}
  body.cc #cc{display:block} body.cc #title,body.cc .ui:not(#toast){display:none!important}
  #ccDrag{position:absolute;inset:0;touch-action:none;cursor:grab}
  #ccHint{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));font:900 22px sans-serif;text-shadow:0 2px 6px #000;pointer-events:none}
  #ccHint span{display:block;font:700 13px sans-serif;opacity:.85;margin-top:3px}
  #ccPanel{position:absolute;right:0;top:0;bottom:0;width:min(400px,46vw);background:rgba(18,22,32,.95);border-left:2px solid rgba(255,255,255,.15);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right)}
  #ccTabs{display:flex;flex-wrap:wrap;gap:5px;padding:10px 10px 6px}
  #ccTabs::-webkit-scrollbar{display:none}
  .cctab{flex:0 0 auto;padding:8px 10px;border-radius:10px;background:#232a39;font-weight:800;font-size:13px;cursor:pointer;border:2px solid transparent;white-space:nowrap}
  .cctab.on{border-color:#7fe3cf;background:#2a3c46}
  #ccBody{flex:1;overflow-y:auto;padding:0 12px 12px;-webkit-overflow-scrolling:touch;touch-action:pan-y;font-size:14px}
  .ccl{font-weight:800;font-size:13px;margin:12px 0 6px;color:#7fe3cf}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:7px 10px;border-radius:9px;background:#232a39;border:2px solid transparent;font-size:13px;font-weight:700;cursor:pointer}
  .chip.on{border-color:#fff;background:#3a4660}
  .sws{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sw{width:30px;height:30px;border-radius:8px;border:2px solid rgba(255,255,255,.25);cursor:pointer}
  .sw.on{border:3px solid #fff;box-shadow:inset 0 0 0 2px rgba(0,0,0,.55)}
  .swc{position:relative;width:30px;height:30px;border-radius:8px;border:2px dashed #fff;overflow:hidden;cursor:pointer;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
  .swc.on{border-style:solid;border-width:3px}
  .swc input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);opacity:0;cursor:pointer;border:0;padding:0}
  .ccrow{display:flex;gap:8px} .ccrow input{flex:1;min-width:0;height:40px;border-radius:9px;border:2px solid rgba(255,255,255,.25);background:#11151d;color:#fff;font-size:16px;padding:0 10px}
  .ccdots{display:flex;gap:3px} .ccdots i{width:12px;height:26px;border-radius:4px;border:1px solid rgba(255,255,255,.3)}
  #ccFoot{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1)}
  #ccFoot .mbtn{min-width:0}
  @media (orientation:portrait){ #ccPanel{left:0;right:0;top:auto;width:auto;height:56vh;border-left:none;border-top:2px solid rgba(255,255,255,.15);padding-top:0;border-radius:16px 16px 0 0} }
  #warp{position:fixed;inset:-50%;z-index:30;pointer-events:none;opacity:0;transition:opacity .45s;background:conic-gradient(from 0deg,#ff7ae8,#7ad7ff,#ffe27a,#7aff9a,#ff7ae8);animation:warpspin 0.8s linear infinite}
  #warp.on{opacity:1} @keyframes warpspin{to{transform:rotate(360deg)}}
  /* demo mode */
  #mbox.wide{width:min(760px,calc(100vw - 20px))}
  .dmTot{float:right;font-size:12px;color:#b8c0cf;font-weight:700}
  .dmScene{background:#232a39;border-radius:12px;padding:8px 10px;margin-top:8px}
  .dmHead{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .dmHead .ibtn{min-width:36px;height:32px;padding:0 6px}
  .dmHead .ibtn[disabled]{opacity:.35}
  .dmGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 8px;margin-top:6px}
  .dmGrid label,.dmCapL{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:#b8c0cf}
  .dmCapL{margin-top:6px}
  #mbox select,#mbox input[type=number],.dmCapL input{height:36px;border-radius:8px;border:2px solid rgba(255,255,255,.2);background:#11151d;color:#fff;font-size:15px;padding:0 6px;width:100%;min-width:0}
  .dmRow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap} .dmRow select{flex:1}
  .dmInline{display:flex;gap:8px;align-items:center;font-weight:700} .dmInline input[type=number]{width:90px!important}
  .dmInline input[type=range]{width:180px}
  body.demo:not(.duser) .ui:not(.dm){display:none!important} body.demo:not(.duser) #joyBase,body.demo:not(.duser) #joyKnob{display:none!important}
  body.demo.duser:not(.no-touch) #act{display:block!important} body.duser #bPlace{display:none!important} #bSwap{right:0;top:20px;display:none}
  body.demo.duser:not(.dconc) #bSwap{display:flex!important} body.demo.duser.dconc #bBreak{display:none!important} body.demo.duser:not(.dconc) #cross{display:block!important}
  #dmFade{inset:0;background:#000;opacity:0;pointer-events:none;z-index:8;display:none}
  body.demo #dmFade{display:block}

<script>
(function(){
'use strict';

// ================= WORLD =================

let NCX=W/CH, NCZ=D/CH;
const SEA=8, SPAWN_H=11;

const idx=(x,y,z)=>x+z*W+y*W*D;

function get(x,y,z){ if(x<0||y<0||z<0||x>=W||y>=H||z>=D) return 0; return world[idx(x,y,z)]; }
const inB=(x,y,z)=>x>=0&&y>=0&&z>=0&&x<W&&y<H&&z<D;

// ================= TEXTURES =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const T=16, COLS=16, ROWS=6;
const atlas=document.createElement('canvas'); atlas.width=COLS*T; atlas.height=ROWS*T;
const actx=atlas.getContext('2d');
const TILES={}; let tileCount=0;
const cl=v=>v<0?0:v>255?255:v|0;
const mul=(c,f)=>[c[0]*f,c[1]*f,c[2]*f];
const nz=(c,r,a)=>mul(c,1+(r()-0.5)*a);
function paint(id,seed,fn){
  const img=actx.createImageData(T,T); const r=mulberry32(seed);
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const c=fn(x,y,r); const i=(y*T+x)*4;
    img.data[i]=cl(c[0]);img.data[i+1]=cl(c[1]);img.data[i+2]=cl(c[2]);img.data[i+3]=c.length>3?c[3]:255;
  }
  actx.putImageData(img,(id%COLS)*T,Math.floor(id/COLS)*T);
}
function makeTile(name,seed,fn){ const id=tileCount++; TILES[name]=id; paint(id,seed,fn); }
const GREEN=[96,160,56], DIRT=[134,96,67];
makeTile('grass_top',1,(x,y,r)=>{let c=nz(GREEN,r,.25); if(r()<.08)c=mul(c,.78); return c;});
function dirtPx(r){let c=nz(DIRT,r,.22); const q=r(); if(q<.06)c=[100,72,50]; else if(q<.09)c=[165,135,105]; return c;}
makeTile('dirt',2,(x,y,r)=>dirtPx(r));
{const rr=mulberry32(33); const fr=[]; for(let i=0;i<T;i++)fr.push(3+Math.floor(rr()*3));
 makeTile('grass_side',3,(x,y,r)=> y<fr[x]? nz(GREEN,r,.25) : dirtPx(r));}
makeTile('sand',4,(x,y,r)=>{let c=nz([219,205,160],r,.12); if(r()<.05)c=[190,175,130]; return c;});
makeTile('clay',5,(x,y,r)=>nz(mul([158,164,178],1+Math.sin(y*0.8)*0.03),r,.06));
makeTile('granite',6,(x,y,r)=>{const q=r(); if(q<.17)return nz([45,42,42],r,.2); if(q<.38)return nz([238,236,230],r,.06); if(q<.55)return nz([214,140,128],r,.1); return nz([196,170,160],r,.1);});
makeTile('basalt',7,(x,y,r)=>{let c=nz([62,62,66],r,.15); if(r()<.04)c=[35,35,38]; return c;});
makeTile('obsidian',8,(x,y,r)=>{const s=Math.sin(x*0.6+y*0.9)+Math.sin(x*0.2-y*0.5); let c=s>1.3?[62,42,92]:nz([20,15,30],r,.3); if(r()<.025)c=[200,190,230]; return c;});
{const rr=mulberry32(91); const holes=[]; for(let i=0;i<14;i++)holes.push([rr()*16,rr()*16,0.7+rr()*1.3]);
 makeTile('pumice',9,(x,y,r)=>{for(const h of holes){if(Math.hypot(x+.5-h[0],y+.5-h[1])<h[2])return nz([140,134,124],r,.1);} return nz([210,205,192],r,.08);});}
makeTile('sandstone',10,(x,y,r)=>{const b=Math.sin(y*0.9+Math.sin(x*0.3)*0.6); return nz(b>0.4?[200,160,100]:b<-0.5?[230,198,140]:[216,180,120],r,.08);});
makeTile('limestone',11,(x,y,r)=>{let c=nz([226,221,200],r,.06); if(r()<.06)c=[190,185,165]; return c;});
{ const id=TILES.limestone, ox=(id%COLS)*T, oy=Math.floor(id/COLS)*T; actx.fillStyle='rgb(165,155,130)';
  [[3,4],[10,9],[6,12]].forEach(([fx,fy])=>{actx.fillRect(ox+fx,oy+fy,3,1);actx.fillRect(ox+fx,oy+fy+1,1,1);actx.fillRect(ox+fx+2,oy+fy+1,1,1);actx.fillRect(ox+fx+1,oy+fy+2,1,1);}); }
makeTile('shale',12,(x,y,r)=>nz((y%3===0)?[62,66,72]:[86,90,96],r,.1));
{const rr=mulberry32(77); const peb=[]; const cols=[[150,150,150],[110,90,70],[220,215,205],[180,120,90],[90,95,100]];
 for(let i=0;i<9;i++)peb.push([rr()*16,rr()*16,1.4+rr()*1.8,cols[Math.floor(rr()*cols.length)]]);
 makeTile('conglomerate',13,(x,y,r)=>{for(const p of peb){const d=Math.hypot(x+.5-p[0],y+.5-p[1]); if(d<p[2])return nz(mul(p[3],d>p[2]-0.8?0.8:1),r,.08);} return nz([176,152,118],r,.12);});}
makeTile('marble',14,(x,y,r)=>{const v=Math.abs(Math.sin(x*0.35+y*0.55+Math.sin(y*0.4)*2)); return v<0.12?nz([150,150,155],r,.08):nz([242,240,236],r,.04);});
makeTile('slate',15,(x,y,r)=>nz(((x+y*2)%5===0)?[58,66,80]:[74,84,100],r,.08));
makeTile('quartzite',16,(x,y,r)=>{let c=nz([236,214,208],r,.12); if(r()<.05)c=[255,252,250]; return c;});
makeTile('gneiss',17,(x,y,r)=>{const s=Math.sin(y*0.85+Math.sin(x*0.45)*1.6); let c=s>0.15?nz([62,56,56],r,.15):nz([216,204,192],r,.08); if(r()<.06)c=[180,120,110]; return c;});
makeTile('quartz',18,(x,y,r)=>{let c=nz([238,232,246],r,.05); if(x===y||x===y+8||x+8===y)c=[255,255,255]; if((x+y)%16===15)c=[205,195,225]; if(r()<.04)c=[250,215,230]; return c;});
makeTile('coal',19,(x,y,r)=>{let c=nz([30,30,33],r,.3); if(r()<.06)c=[110,110,125]; return c;});
makeTile('log_side',20,(x,y,r)=>nz((x%4===0)?[78,58,34]:[104,78,46],r,.15));
makeTile('log_top',21,(x,y,r)=>{const d=Math.hypot(x-7.5,y-7.5); if(d>6.8)return nz([92,68,40],r,.15); return nz(Math.floor(d*1.2)%2?[176,138,82]:[150,112,64],r,.08);});
makeTile('planks',22,(x,y,r)=>{if(y%4===3)return [120,88,50]; let c=nz([182,142,88],r,.1); if((x===2||x===13)&&y%4===1)c=[90,70,45]; return c;});
makeTile('glass',23,(x,y,r)=>{if(x===0||y===0||x===15||y===15)return [205,232,238,255]; if((x-y===3||x-y===4)&&x>3&&x<11)return [240,252,255,255]; return [0,0,0,0];});
makeTile('leaves',24,(x,y,r)=>{const q=r(); if(q<.16)return [0,0,0,0]; let c=nz([58,130,44],r,.35); if(q>.85)c=[40,95,30]; return c;});
const waterFn=ph=>(x,y,r)=>{const w=Math.sin((x+ph*2)*0.8+y*0.4)+Math.sin(y*1.1-ph)*0.5; return nz(w>1.05?[95,155,232]:[46,104,200],r,.06);};
const lavaFn=ph=>(x,y,r)=>{const v=Math.sin(x*0.7+ph)+Math.sin(y*0.6-ph*0.7)+Math.sin((x+y)*0.4+ph*0.5); const t=(v+3)/6;
  return nz(t>0.68?[255,222,90]:t>0.47?[246,132,30]:t>0.28?[205,62,16]:[112,26,10],r,.08);};
makeTile('water',25,waterFn(0));
makeTile('lava',26,lavaFn(0));
makeTile('bed',27,(x,y,r)=>{ if(y<5)return nz([240,236,226],r,.04); if(y===5||x===0||x===15)return [120,80,50]; return nz(((x>>2)+(y>>2))%2?[200,40,45]:[170,28,35],r,.06); });
function spawnerTile(name,sd,core){ makeTile(name,sd,(x,y,r)=>{ if(x%5===0||y%5===0)return nz([40,40,46],r,.15); const d=Math.hypot(x-7.5,y-7.5); if(d<4)return nz(core,r,.15); return nz([18,18,22],r,.2); }); }
spawnerTile('spawn_skel',28,[235,230,210]); spawnerTile('spawn_orc',29,[90,190,60]); spawnerTile('spawn_troll',30,[150,160,175]);
// town blocks for Rail Rampage
makeTile('brick',31,(x,y,r)=>{ const off=(y>>2)%2?4:0; if(y%4===3||(x+off)%8===7)return nz([200,196,186],r,.05); return nz(r()<.1?[150,52,40]:[178,64,48],r,.1); });
makeTile('concrete',32,(x,y,r)=>{ let c=nz([182,182,178],r,.07); if(r()<.04)c=[150,150,146]; if(y===0||y===15)c=[160,160,156]; return c; });
makeTile('window',33,(x,y,r)=>{ if(x<2||y<2||x>13||y>13||x===7||x===8)return nz([210,210,205],r,.04); return (x-y>3&&x-y<7)?[190,225,250]:nz([70,120,170],r,.06); });

{ const paintTile=(name,sd,c)=>makeTile(name,sd,(x,y,r)=>{ let k=nz(c,r,.04); if(y<3)k=mul(k,1.15); if(y>13||x===0||x===15)k=mul(k,0.8); return k; });
  paintTile('paint_red',35,[205,40,40]); paintTile('paint_blue',36,[40,90,210]); paintTile('paint_yellow',37,[240,196,40]); paintTile('paint_green',38,[50,170,80]); paintTile('paint_white',39,[236,236,232]); }
makeTile('tire',40,(x,y,r)=>{ const d=Math.hypot(x-7.5,y-7.5); if(d<3)return nz([170,170,175],r,.08); return nz([28,28,30],r,.2); });
makeTile('gold',41,(x,y,r)=>{ const v=Math.sin(x*0.5+y*0.3); return nz(v>0.7?[255,236,140]:[222,170,40],r,.07); });
makeTile('barrel_side',42,(x,y,r)=>{ if(y===2||y===13)return nz([90,20,20],r,.1); if(y>=6&&y<=9)return ((x+y)%4<2)?[30,30,30]:[250,200,30]; return nz([200,30,30],r,.08); });
makeTile('barrel_top',43,(x,y,r)=>{ const d=Math.hypot(x-7.5,y-7.5); if(d>6.5)return nz([110,20,20],r,.1); if(d<2)return [40,40,40]; return nz([190,30,30],r,.08); });

makeTile('steel',47,(x,y,r)=>{ const v=Math.sin((x+y)*0.4); return nz(v>0.6?[226,230,236]:[176,182,192],r,.05); });

// fire texture (4 animation frames stacked)
const fireC=document.createElement('canvas'); fireC.width=16; fireC.height=64; const fctx=fireC.getContext('2d');
for(let f=0;f<4;f++){ const img=fctx.createImageData(16,16); const rr=mulberry32(500+f); const hc=[];
  for(let x=0;x<16;x++)hc.push(4+rr()*7+(x>3&&x<12?4:0));
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){ const h=15-y, i=(y*16+x)*4; if(h<hc[x] && !(h>hc[x]-3&&rr()<.3)){ const t=h/hc[x];
      const c=t<0.35?[255,240,150]:t<0.7?[255,150,30]:[220,60,10]; img.data[i]=c[0];img.data[i+1]=c[1];img.data[i+2]=c[2];img.data[i+3]=255; } }
  fctx.putImageData(img,0,f*16); }

// ================= BLOCKS =================
makeTile('portal_frame',91,(x,y,r)=>{ const v=Math.sin(x*0.7+y*0.5)+Math.sin(y*0.9-x*0.4); return v>1.3?[200,120,255]:nz([34,22,48],r,.3); });

  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02); }

function lookDir(){ const cp=Math.cos(pitch); return new THREE.Vector3(-Math.sin(yaw)*cp,Math.sin(pitch),-Math.cos(yaw)*cp); }
function raycast(o,d,maxD){
  let x=Math.floor(o.x),y=Math.floor(o.y),z=Math.floor(o.z);
  const sx=d.x>0?1:-1, sy=d.y>0?1:-1, sz=d.z>0?1:-1;
  const tdx=d.x?Math.abs(1/d.x):Infinity, tdy=d.y?Math.abs(1/d.y):Infinity, tdz=d.z?Math.abs(1/d.z):Infinity;
  let tx=d.x?(d.x>0?x+1-o.x:o.x-x)*tdx:Infinity, ty=d.y?(d.y>0?y+1-o.y:o.y-y)*tdy:Infinity, tz=d.z?(d.z>0?z+1-o.z:o.z-z)*tdz:Infinity;
  let t=0, face=[0,0,0];
  while(t<=maxD){
    if(y>=0&&y<H){ const b=get(x,y,z); if(b&&B[b].target) return {x,y,z,face,b,t}; }
    if(tx<ty&&tx<tz){ x+=sx; t=tx; tx+=tdx; face=[-sx,0,0]; }
    else if(ty<tz){ y+=sy; t=ty; ty+=tdy; face=[0,-sy,0]; }
    else { z+=sz; t=tz; tz+=tdz; face=[0,0,-sz]; }
  }
  return null;
}
function rayBox(o,d,e){ let tmin=0,tmax=Infinity; const mn=[e.p[0]-e.hw,e.p[1],e.p[2]-e.hw], mx=[e.p[0]+e.hw,e.p[1]+e.h,e.p[2]+e.hw]; const oo=[o.x,o.y,o.z], dd=[d.x,d.y,d.z];
  for(let a=0;a<3;a++){ if(Math.abs(dd[a])<1e-9){ if(oo[a]<mn[a]||oo[a]>mx[a])return null; continue; }
    let t1=(mn[a]-oo[a])/dd[a], t2=(mx[a]-oo[a])/dd[a]; if(t1>t2){const q=t1;t1=t2;t2=q;} tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2); if(tmin>tmax)return null; }
  return tmin; }
let target=null, aimMob=null, aimNPC=false, camDist=0;
function updateTarget(){
  const o=camera.position.clone(), d=lookDir();
  const reach = camMode===1 ? 6 : 6+camDist, mreach = (WP[weapon].ranged?(WP[weapon].range||40):3.6)+(camMode===1?0:camDist);
  target=raycast(o,d,reach);
  let bt=target?target.t:Infinity;
  if(WP[weapon].ranged&&!target){ const far=raycast(o,d,mreach); if(far)bt=far.t; }
  aimMob=null; let best=Math.min(bt,mreach);
  for(const m of mobs){ const t=rayBox(o,d,m); if(t!==null&&t<best){best=t;aimMob=m;} }
  const nt=mode==='survival'&&place==='survival'?rayBox(o,d,merchant):null; aimNPC = !aimMob && nt!==null && nt<Math.min(bt,mreach+1.5);
  aimFruit=null; if(!aimMob&&!aimNPC){ let fb=Math.min(bt,5+(camMode===1?0:camDist));
    for(const tr of appleTrees)for(const sl of tr.slots){ const c=sl.pos, ox=c[0]-o.x, oy=c[1]-o.y, oz=c[2]-o.z, tt=ox*d.x+oy*d.y+oz*d.z;
      if(tt<0||tt>fb)continue; const px=ox-d.x*tt, py=oy-d.y*tt, pz=oz-d.z*tt; if(px*px+py*py+pz*pz<0.36*0.36){ fb=tt; aimFruit={tr,sl}; } } }
  $('cross').classList.toggle('mob',!!aimMob);
  if(target&&!aimMob&&!aimNPC&&!aimFruit){ hl.visible=true; hl.position.set(target.x+0.5,target.y+0.5,target.z+0.5); } else hl.visible=false;
  const lk=$('looking'); let html='';
  if(aimMob) html='⚔️ <b>'+aimMob.t.name+'</b> &nbsp;❤ '+Math.max(0,aimMob.hp)+'/'+aimMob.t.hp;
  else if(aimNPC) html='🧔 <b>Flint the Prospector</b> (tap 🧱 to talk)';
  else if(aimFruit) html=aimFruit.sl.st===2?'🍎 <b>Apple</b> (tap ⛏ or 🧱 to pick it and heal)':'🌸 <b>Apple blossom</b> (it will grow into an apple)';
  else if(target){ const b=B[target.b]; html='Looking at: <b>'+b.name+'</b> <span class="badge" style="background:'+CAT[b.cat].c+'">'+b.cat+'</span>'; }
  if(html){ if(lk._h!==html){ lk.innerHTML=html; lk._h=html; } lk.style.display='block'; } else lk.style.display='none';
}

  atkCd=w.cd; const d=lookDir(), o=camera.position.clone().addScaledVector(d,0.4);

// --- boomerang: flies out, curves, comes back to the player's hand
let boom=null;
function throwBoomerang(o,d,w){
  const mesh=boomerangShape(new THREE.Group(),c=>lm(c),false); mesh.scale.setScalar(1.3); scene.add(mesh);
  const side=new THREE.Vector3(-d.z,0,d.x).normalize();
  boom={p:o.clone(),d:d.clone(),side,t:0,out:true,dmg:w.dmg,hit:new Set(),mesh,spin:0,wT:0}; sfx('throw'); refreshHeld();
}
function boomHome(){ return new THREE.Vector3(pl.p[0],pl.p[1]+1.2,pl.p[2]); }
function updateBoomerang(dt){
  if(!boom)return; const b=boom; b.t+=dt;
  const OUT=0.6, SPD=26;
  if(b.out){
    // fast at first, slowing to a stop at the far end, drifting sideways into a curve
    const sp=SPD*Math.max(0.05,1-b.t/OUT);
    b.p.addScaledVector(b.d,sp*dt).addScaledVector(b.side,2*Math.sin(b.t/OUT*Math.PI)*dt);
    if(solidAt(Math.floor(b.p.x),Math.floor(b.p.y),Math.floor(b.p.z))){ burst(b.p.x-0.5,b.p.y-0.5,b.p.z-0.5,new THREE.Color(.7,.5,.3),4); sfx('thunk'); b.out=false; b.hit.clear(); }
    if(b.t>=OUT){ b.out=false; b.hit.clear(); }
  } else {
    const h=boomHome(), to=h.clone().sub(b.p), dist=to.length(), sp=Math.min(24,8+(b.t-OUT)*30);
    if(dist<0.9||b.t>6){ scene.remove(b.mesh); b.mesh.traverse(o=>{ if(o.geometry)o.geometry.dispose(); }); boom=null; sfx('catch'); refreshHeld(); return; }
    b.p.addScaledVector(to.normalize(),Math.min(dist,sp*dt));
  }
  for(const m of mobs){ if(!b.hit.has(m)&&boxHit(m,b.p.x,b.p.y,b.p.z,0.45)){ b.hit.add(m); damageMob(m,b.dmg,m.p[0]-pl.p[0],m.p[2]-pl.p[2],1.5); } }
  b.spin+=dt*22; b.mesh.position.copy(b.p); b.mesh.rotation.set(-Math.PI/2,0,b.spin);

async function exportGame(data,name){
  const fn=((name||'').replace(/[^\w\- ]+/g,'').trim()||'blockstar')+'.json';

      const w=await h.createWritable(); await w.write(blob); await w.close(); toast('💾 Saved '+h.name); return; }
    catch(e){ if(e&&e.name==='AbortError')return; } }
  try{ const f=new File([blob],fn,{type:'application/json'}); // phones: share sheet → Save to Files, pick a folder
    if(IS_TOUCH&&navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:fn}); return; } }
  catch(e){ if(e&&e.name==='AbortError')return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fn; document.body.appendChild(a); a.click();

let appleCheckT=0;

function tuneScore(T){ // 8 bars of 16 steps: phrases A A B A, with the strong beats snapped onto the chord
  const r=mulberry32(T.seed); const phrase=()=>{ const rows=[]; let cur=9; for(let b=0;b<2;b++){ const row=new Array(16).fill(null);
    for(let s=0;s<16;s+=s%4===0&&r()<0.3?1:2){ if(r()<(s%4===0?0.9:0.55)){ cur+=Math.round((r()-0.5)*4.4); cur=Math.max(6,Math.min(15,cur)); row[s]=cur; } } rows.push(row); } return rows; };

  rows.forEach((row,i)=>{ const c=T.prog[i%4]; for(let s=0;s<16;s+=4){ let m=row[s]; if(m==null)continue; for(let k=0;k<4;k++){ const q=(((m-k-c)%7)+7)%7, q2=(((m+k-c)%7)+7)%7; if(q===0||q===2||q===4){ m-=k; break; } if(q2===0||q2===2||q2===4){ m+=k; break; } } row[s]=m; } });

  else if(s%2===0)mn('triangle',midiF(deg(T,c+[0,2,4,2][(s/2)%4],1)),t,sp*1.8,0.045);
  const m=st.score[bar][s]; if(m!=null){ let len=1; while(s+len<16&&st.score[bar][s+len]==null&&len<4)len++;
    mn(T.lead,midiF(deg(T,m,0)),t,sp*len*0.92,T.lead==='square'||T.lead==='sawtooth'?0.06:0.13); if(st.notes){ st.notes.push([t,t+sp*len*0.85,m]); if(st.notes.length>48)st.notes.shift(); } }

// the beat of the song that's playing: exact for the built-in tunes, 120 beats a minute for anything else
function musBeat(){ if(musOnNow==='tune'&&tuneSt&&AC&&AC.state==='running'&&tuneSt.t0)return Math.max(0,AC.currentTime-tuneSt.t0)*tuneSt.T.bpm/60; return (demo?demo.t:intK&&intK.club?intK.t:0)*2; }
// how loud the singing range of your own song file is (0 to 1), or -1 when the browser can't listen to it
let mp3An=null, mp3AnTry=0;
function musLevel(){ if(musOnNow!=='mp3'||!AC||!songEl.captureStream)return -1;
  if(!mp3An){ if(songEl.paused||performance.now()<mp3AnTry)return -1; mp3AnTry=performance.now()+1000;
    try{ const st=songEl.captureStream(); if(!st.getAudioTracks().length)return -1; const an=AC.createAnalyser(), z=AC.createGain(); an.fftSize=1024; an.smoothingTimeConstant=0.35; z.gain.value=0;
      AC.createMediaStreamSource(st).connect(an); an.connect(z); z.connect(AC.destination); mp3An={an,buf:new Uint8Array(an.frequencyBinCount),lo:255,hi:1}; }catch(e){ return -1; } }
  const A=mp3An, hz=AC.sampleRate/1024, a=Math.max(1,Math.round(250/hz)), b=Math.round(3200/hz); A.an.getByteFrequencyData(A.buf);
  let s=0; for(let i=a;i<=b;i++)s+=A.buf[i]; s/=(b-a+1); A.lo=Math.min(s,A.lo+0.15); A.hi=Math.max(s,A.hi*0.997,A.lo+8);
  return Math.max(0,Math.min(1,(s-A.lo)/(A.hi-A.lo)*1.3-0.15)); }
// the hero's mouth in "moves with the music" mode: 3 sections of singing, then 1 to dance (an instrumental break)
function autoSing(beat){ if(Math.floor(beat/16)%4===3)return 0;
  if(musOnNow==='tune'&&tuneSt&&tuneSt.notes){ const t=AC.currentTime, n=tuneSt.notes.find(q=>t>=q[0]&&t<q[1]); if(!n)return 0; // sing the tune's melody
    const f=(t-n[0])/(n[1]-n[0]); return (0.5+0.5*(((n[2]%5)+5)%5)/4)*(f<0.7?1:Math.max(0.15,1-(f-0.7)*3)); }
  const lv=musLevel(); if(lv>=0)return lv;
  if(Math.floor(beat/4)%4===3)return 0; // no way to listen (YouTube, Safari): syllables on the eighth notes, with a breath every 4th bar
  const e=Math.floor(beat*2), fr=beat*2-e, h=Math.sin(e*12.9898)*43758.5453, r=h-Math.floor(h); if(r<0.22)return 0;
  return (0.45+0.55*((r*7.31)%1))*(fr<0.7?1:0.15); }

// dust, scratches, flicker, a wobble and a camcorder stamp. Glitchy keeps the last moment of the game and, on the beat, plays a

function fxSet(k){ if(fxK.cur===k)return; fxK.cur=k; const film=k==='film';
  canvas.style.filter=k==='bw'?'grayscale(1) contrast(1.12)':k==='sepia'?'sepia(0.9) contrast(1.06) brightness(1.04)':''; canvas.style.transform='';
  for(const id of['fxGrain','fxVig','fxStamp'])$(id).style.display=film?'block':'none';
  fxGl.style.display='none'; fxGl.style.filter=''; fxK.on=null; fxK.ring.length=0; fxK.ri=0; fxK.gT=0; fxK.shake=0; }

function fxTick(dt){ const k=fxKind(); fxSet(k); if(k==='normal'||k==='bw'||k==='sepia')return; const beat=musBeat(), r=Math.random;
  if(k==='funky'){ const p=Math.pow(0.5+0.5*Math.cos((beat%1)*Math.PI*2),3); // the colours roll round the rainbow and pulse on the beat
    canvas.style.filter='hue-rotate('+Math.round((beat*22.5)%360)+'deg) saturate(2.3) contrast(1.15) brightness('+(1+0.14*p).toFixed(3)+')'; return; }

    const d=fxGrD.data; for(let i=0;i<d.length;i+=4){ const v=128+(r()-0.5)*100; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; } fxGrX.putImageData(fxGrD,0,0);

function crashBlast(x,y,z,groundY,r){ const gy=Math.round(groundY), R=Math.ceil(r), safe=CRASH_SAFE();
  for(let k=0;k<3;k++)burst(x-0.5+(rand()-.5)*1.5,y-0.5+(rand()-.5),z-0.5+(rand()-.5)*1.5,new THREE.Color(1,0.45+rand()*0.3,0.08),9);

    if(by<gy||!inB(bx,by,bz))continue; const id=get(bx,by,bz); if(!id||B[id].fluid||id===ID.fire||safe.has(id))continue; // only things standing on the ground

  for(let dx=-R-1;dx<=R+1;dx++)for(let dz=-R-1;dz<=R+1;dz++){ if(dx*dx+dz*dz>(r+1)*(r+1)||rand()>0.6)continue; const bx=Math.floor(x)+dx, bz=Math.floor(z)+dz; // oil and burn marks
    for(let by=gy;by>=gy-2;by--){ const id=get(bx,by,bz); if(!id)continue; if(B[id].solid&&!safe.has(id))setBlock(bx,by,bz,ID.scorch); break; } }
  for(let k=0;k<2;k++)if(rand()<0.6)tryIgnite(Math.floor(x+(rand()-.5)*3),gy,Math.floor(z+(rand()-.5)*3)); // a small fire

function dragPilot(dt,P){ const v=drive, K=dragK; if(!v||!K){ return; } P.t+=dt; const R=K.race, A=dragAuto; A.str=0; A.pin=0;
  if(v.jet){ // a long, climbing turn around the city
    P.ft+=dt; const J=v.jet; A.gas=P.ft<5?1:0.4; A.brk=0; A.pin=Math.max(-1,Math.min(1,(240-v.p[1])/40-J.pitch*1.5)); A.str=P.ft<2?0:Math.min(0.45,(P.ft-2)*0.3); return; }
  if(P.ft>0){ A.gas=0; A.brk=v.spd>0.15?1:0; return; } // back from a flight: park
  if(v.air){ A.gas=1; A.brk=0; return; }
  const s=dsFront(v), lx=DR.LANE[P.L]; A.str=Math.max(-1,Math.min(1,(v.p[0]-lx)*-0.6+v.h*2.5)); // keep in the middle of the lane
  const hold=v.spd>0.15?1:0; // brake only while rolling forward (holding it when stopped backs up)
  if(P.ph==='roll'){ if(s<-15){ A.gas=v.spd<5?0.3:0; A.brk=0; } else { A.gas=0; A.brk=hold; if(Math.abs(v.spd)<0.3){ P.ph='burn'; P.burn=0; } } }
